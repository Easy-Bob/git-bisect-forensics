_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Find the commit that broke the tests, and prove it"
summary: "Ask it to find the commit that broke the tests in one of five projects - moneyfmt, dateparse, iniparse, slugify or csvsum. Example: 'Find the commit that broke moneyfmt.' An agent searches the history with three batches of test runs, and a verifier checks the answer against every commit's real test result."
highlights:
  - "Five bundled histories, with skipped commits, boundary cases and a misleading commit message"
  - "An answer only counts when the agent's own test runs prove it"
  - "Runs offline: no network, no git, the same result on every computer"
steps:
  - "Ask to bisect one of the repos: moneyfmt, dateparse, iniparse, slugify or csvsum"
  - "The agent reads the log and tests up to 7 commits at a time, at most 3 times"
  - "It submits the first bad commit, and the verdict card shows which checks hold"
